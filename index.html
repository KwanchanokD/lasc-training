<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบลงทะเบียนอบรม — PSU:LASC</title>
<meta name="theme-color" content="#1d5a8f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1d5a8f; --primary-dark: #143f66; --primary-light: #e8f0f8;
    --accent: #0e7c66; --accent-light: #e3f3ee; --danger: #c0392b; --warning: #b9770e;
    --mooc: #6a3d9a; --mooc-light: #f1eaf8; --prac: #0e7c66; --prac-light: #e3f3ee;
    --bg: #f4f6f9; --card: #fff; --text: #2c3e50; --muted: #6f7d86;
    --border: #dfe6ee; --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Sarabun','Leelawadee UI',Tahoma,sans-serif; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.6; }

  header.app-header {
    background: radial-gradient(900px 200px at 88% -40%, rgba(255,255,255,.20), transparent 70%),
                linear-gradient(135deg, var(--primary-dark), var(--primary));
    color: #fff; padding: 14px 22px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.15); border-bottom: 3px solid var(--accent);
  }
  header.app-header .logo { background: #fff; border-radius: 50%; width: 54px; height: 54px; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(0,0,0,.22); overflow: hidden; }
  header.app-header .logo img { width: 100%; height: 100%; object-fit: cover; }
  header.app-header h1 { font-size: 17px; font-weight: 600; }
  header.app-header p { font-size: 12.5px; opacity: .85; }
  header .who { margin-left: auto; display: flex; gap: 10px; align-items: center; font-size: 13px; flex-wrap: wrap; }
  header .who .chip { background: rgba(255,255,255,.16); color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
  header .who .chip.role { background: rgba(255,255,255,.32); font-weight: 600; }
  header .who button { background: rgba(255,255,255,.95); color: var(--primary-dark); border: none; border-radius: 7px;
    padding: 5px 12px; font-family: inherit; font-size: 13px; cursor: pointer; }
  .demo-bar { background: #fdf3e2; color: #7a4f06; border-bottom: 1px solid #f0c987; padding: 6px 16px; font-size: 13px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .demo-bar button { font-family: inherit; font-size: 12.5px; border: 1px solid #d9a441; background: #fff; border-radius: 6px; padding: 2px 10px; cursor: pointer; }

  nav.tabs { background: #fff; border-bottom: 1px solid var(--border); display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; }
  nav.tabs button { background: none; border: none; border-bottom: 3px solid transparent; padding: 11px 16px;
    font-family: inherit; font-size: 14.5px; color: var(--muted); cursor: pointer; white-space: nowrap; }
  nav.tabs button.active { color: var(--primary-dark); border-bottom-color: var(--primary); font-weight: 600; }
  nav.tabs .sep { width: 1px; background: var(--border); margin: 10px 6px; flex: none; }
  .badge { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px;
    background: var(--danger); color: #fff; font-size: 12px; line-height: 20px; text-align: center; }

  .container { max-width: 1180px; margin: 0 auto; padding: 18px 16px 80px; }
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border);
          box-shadow: 0 1px 4px rgba(0,0,0,.05); margin-bottom: 18px; overflow: hidden; }
  .card-head { padding: 11px 18px; background: var(--primary-light); border-bottom: 1px solid var(--border);
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .card-head h2 { font-size: 15.5px; font-weight: 600; color: var(--primary-dark); }
  .card-head .hint { font-size: 12.5px; color: var(--muted); }
  .card-head .right { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .card-body { padding: 18px; }
  .card-head.mooc { background: var(--mooc-light); } .card-head.mooc h2 { color: var(--mooc); }
  .card-head.prac { background: var(--prac-light); } .card-head.prac h2 { color: var(--prac); }

  .grid { display: grid; gap: 13px; }
  .grid-2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .grid-3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .span-all { grid-column: 1 / -1; }
  label.field { display: block; font-size: 13.5px; font-weight: 500; }
  .req { color: var(--danger); }
  label.field small { display: block; color: var(--muted); font-weight: 400; font-size: 12px; }
  label.field input, label.field select, label.field textarea, .inp {
    display: block; width: 100%; margin-top: 4px; padding: 8px 11px;
    border: 1px solid var(--border); border-radius: 8px;
    font-family: inherit; font-size: 14.5px; background: #fff; color: var(--text);
  }
  label.field input:focus, label.field select:focus, label.field textarea:focus, .inp:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29,90,143,.14);
  }
  textarea { resize: vertical; min-height: 64px; line-height: 1.6; }
  label.check { display: flex; align-items: flex-start; gap: 8px; font-size: 14px; font-weight: 500; cursor: pointer; }
  label.check input { margin-top: 4px; flex: none; width: 17px; height: 17px; accent-color: var(--primary); }

  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border: none;
         border-radius: 8px; font-family: inherit; font-size: 14.5px; font-weight: 500; cursor: pointer;
         background: var(--primary); color: #fff; text-decoration: none; transition: background .15s; white-space: nowrap; }
  .btn:hover { background: var(--primary-dark); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  .btn.secondary:hover { background: var(--primary-light); }
  .btn.ghost { background: #fff; color: var(--text); border: 1px solid var(--border); }
  .btn.ghost:hover { background: #eef2f6; }
  .btn.ok { background: var(--accent); } .btn.ok:hover { background: #0a5f4e; }
  .btn.mooc { background: var(--mooc); } .btn.mooc:hover { background: #4f2b75; }
  .btn.danger { background: #fff; color: var(--danger); border: 1px solid #e8b4ae; }
  .btn.danger:hover { background: #fdecea; }
  .btn.on { background: var(--accent); color: #fff; border: 1px solid var(--accent); }
  .btn.google { width: 100%; justify-content: center; gap: 10px; padding: 11px 16px; font-size: 15.5px;
    background: #fff; color: #3c4043; border: 1px solid #dadce0; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .btn.google:hover { background: #f7f8f8; }
  .btn.sm { padding: 4px 10px; font-size: 13px; border-radius: 7px; }
  .btn.block { width: 100%; justify-content: center; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .alert { border-radius: 9px; padding: 10px 14px; font-size: 13.8px; margin-bottom: 12px; border: 1px solid; }
  .alert.warn { background: #fdf3e2; border-color: #f0c987; color: #7a4f06; }
  .alert.err  { background: #fdecea; border-color: #f5c6cb; color: #9c0006; }
  .alert.info { background: #e8f1fa; border-color: #b9d4ee; color: #124a82; }
  .alert.ok   { background: #e2efda; border-color: #a9d08e; color: #376e2a; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .hidden { display: none !important; }
  a { color: var(--primary); }
  code, .mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; }
  h3.sec { font-size: 15px; color: var(--primary-dark); margin: 18px 0 8px; }
  h3.sec:first-child { margin-top: 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .stat { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px;
          border-left: 4px solid var(--c, var(--primary)); }
  .stat.click { cursor: pointer; } .stat.click:hover { box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .stat .n { font-size: 24px; font-weight: 700; line-height: 1.2; color: var(--c, var(--primary-dark)); }
  .stat .t { font-size: 12.8px; color: var(--muted); }

  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .toolbar .inp { width: auto; margin: 0; }
  .toolbar .grow { flex: 1 1 220px; }

  .tbl-wrap { overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.tbl th { text-align: left; background: #f7f9fb; color: var(--muted); font-weight: 600; font-size: 12.8px;
    padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.tbl td { padding: 8px 10px; border-bottom: 1px solid #eef2f6; vertical-align: top; }
  table.tbl tr:hover td { background: #fafcfe; }
  table.tbl td.nowrap { white-space: nowrap; }

  .chip { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 12.5px; font-weight: 600;
    background: #eef2f6; color: var(--muted); white-space: nowrap; }
  .chip.mooc { background: var(--mooc-light); color: var(--mooc); }
  .chip.prac { background: var(--prac-light); color: var(--prac); }
  .chip.s-blue { background: #e8f1fa; color: #124a82; }
  .chip.s-orange { background: #fdf3e2; color: #8a5a00; }
  .chip.s-green { background: #e2efda; color: #2f6b22; }
  .chip.s-gold { background: #fff4cc; color: #7a5b00; border: 1px solid #e9c94a; }
  .chip.s-red { background: #fdecea; color: #9c0006; }
  .chip.s-grey { background: #eef0f2; color: #77808a; }

  .courses { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  .course { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
    border-top: 4px solid var(--c, var(--primary)); }
  .course .body { padding: 14px 16px; flex: 1; }
  .course .code { font-size: 12.5px; color: var(--muted); font-family: Consolas, monospace; }
  .course h4 { font-size: 16px; line-height: 1.4; margin: 2px 0 6px; color: var(--text); }
  .course .desc { font-size: 13.5px; color: #4a5a66; margin-bottom: 8px; white-space: pre-line; }
  .course .meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .course .foot { padding: 10px 16px; border-top: 1px solid #eef2f6; background: #fbfcfd; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sessions { margin-top: 10px; display: grid; gap: 8px; }
  .sess { border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
  .sess .d { font-weight: 600; color: var(--prac); }
  .sess .grow { flex: 1 1 180px; }

  .enr { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
    border-left: 5px solid var(--c, var(--primary)); }
  .enr .top { display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap; }
  .enr h4 { font-size: 16px; line-height: 1.4; }
  .enr .top .right { margin-left: auto; text-align: right; }
  .steps { display: flex; gap: 0; margin: 12px 0 10px; flex-wrap: wrap; }
  .step { flex: 1 1 90px; text-align: center; font-size: 12.3px; color: var(--muted); position: relative; padding-top: 24px; }
  .step::before { content: ''; position: absolute; top: 9px; left: 0; right: 0; height: 3px; background: #e3e8ee; }
  .step:first-child::before { left: 50%; } .step:last-child::before { right: 50%; }
  .step .dot { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); width: 17px; height: 17px; border-radius: 50%;
    background: #fff; border: 3px solid #cfd8e1; z-index: 1; }
  .step.done { color: var(--accent); } .step.done::before { background: var(--accent); }
  .step.done .dot { background: var(--accent); border-color: var(--accent); }
  .step.cur { color: var(--primary-dark); font-weight: 600; } .step.cur .dot { border-color: var(--primary); }
  .step.bad { color: var(--danger); } .step.bad .dot { border-color: var(--danger); background: var(--danger); }
  .progress { height: 8px; background: #e9eef3; border-radius: 99px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--mooc); border-radius: 99px; }

  .player { display: grid; grid-template-columns: 290px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .player { grid-template-columns: 1fr; } }
  .lessons { list-style: none; }
  .lessons li { padding: 9px 14px; border-bottom: 1px solid #eef2f6; cursor: pointer; display: flex; gap: 9px; align-items: flex-start; font-size: 14px; }
  .lessons li:hover { background: #f7f5fb; }
  .lessons li.cur { background: var(--mooc-light); font-weight: 600; }
  .lessons li.locked { color: #a5aeb6; cursor: not-allowed; }
  .lessons .ck { flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cfd8e1; font-size: 12px; line-height: 16px; text-align: center; margin-top: 2px; }
  .lessons .ck.y { background: var(--accent); border-color: var(--accent); color: #fff; }
  .video { position: relative; padding-top: 56.25%; background: #111; border-radius: 10px; overflow: hidden; margin-bottom: 14px; }
  .video iframe, .video video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .lesson-text { white-space: pre-line; font-size: 15px; line-height: 1.8; }

  .quiz-q { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .quiz-q .qt { font-weight: 600; margin-bottom: 6px; }
  .quiz-q label { display: flex; gap: 8px; padding: 4px 6px; border-radius: 7px; cursor: pointer; font-size: 14.5px; }
  .quiz-q label:hover { background: #f5f7fa; }
  .quiz-q input { margin-top: 5px; accent-color: var(--mooc); }

  .editor-item { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fbfcfd; }
  .editor-item .head { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 13.5px; color: var(--primary-dark); }
  .editor-item .head .right { margin-left: auto; display: flex; gap: 4px; }
  .choice-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  .choice-row input[type=radio] { width: 17px; height: 17px; flex: none; accent-color: var(--accent); }
  .choice-row .inp { margin: 0; }

  .kv { display: grid; grid-template-columns: 170px 1fr; gap: 4px 12px; font-size: 14px; }
  .kv > div:nth-child(odd) { color: var(--muted); }
  @media (max-width: 560px) { .kv { grid-template-columns: 1fr; } .kv > div:nth-child(odd) { margin-top: 6px; } }
  .slip { max-width: 100%; max-height: 520px; border: 1px solid var(--border); border-radius: 8px; display: block; margin-top: 6px; }

  .modal-bg { position: fixed; inset: 0; background: rgba(20,30,45,.48); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 30px 12px; overflow-y: auto; }
  .modal { background: #fff; border-radius: 12px; width: 100%; max-width: 620px; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .modal.wide { max-width: 940px; }
  .modal-head { display: flex; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border); background: var(--primary-light); border-radius: 12px 12px 0 0; }
  .modal-head h3 { font-size: 16px; color: var(--primary-dark); }
  .modal-head .x { margin-left: auto; background: none; border: none; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); }
  .modal-body { padding: 18px; }
  .modal-foot { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; padding-top: 14px; border-top: 1px solid #eef2f6; }

  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(30px); background: #22313f; color: #fff;
    padding: 10px 18px; border-radius: 9px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 99; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer.pg { text-align: center; font-size: 12.5px; color: var(--muted); padding: 10px 16px 24px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  .verify-box { max-width: 560px; margin: 0 auto; }
  .cert-ok { border: 2px solid var(--accent); border-radius: 12px; padding: 16px 18px; background: #f3faf7; }
  .cert-bad { border: 2px solid var(--danger); border-radius: 12px; padding: 16px 18px; background: #fdf3f2; }
</style>
</head>
<body>
<header class="app-header">
  <div class="logo"><img src="logo-lasc.png" alt="" onerror="this.parentNode.style.display='none'"></div>
  <div>
    <h1>ระบบลงทะเบียนอบรม · ฝึกปฏิบัติ · ใบรับรอง</h1>
    <p id="orgLine">ศูนย์บริการสัตว์ทดลอง มหาวิทยาลัยสงขลานครินทร์</p>
  </div>
  <div class="who" id="whoBox"></div>
</header>
<div id="demoBar" class="demo-bar hidden">
  <span>⚠ <b>โหมดทดลอง</b> — ยังไม่ได้เชื่อมต่อ Firebase ข้อมูลเก็บในเบราว์เซอร์เครื่องนี้เท่านั้น</span>
  <button onclick="demoReset()">ล้างข้อมูลทดลอง</button>
</div>
<nav class="tabs" id="tabs"></nav>
<main class="container" id="main"><div class="card"><div class="card-body muted">กำลังโหลด…</div></div></main>

<div class="modal-bg hidden" id="modalBg">
  <div class="modal" id="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><button class="x" onclick="closeModal()" aria-label="ปิด">×</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<footer class="pg">ระบบลงทะเบียนอบรม · ศูนย์บริการสัตว์ทดลอง มหาวิทยาลัยสงขลานครินทร์ · <span id="verLine"></span></footer>

<script>window.FIREBASE_CONFIG = null;</script>
<script>
/* ▼▼▼ วางค่า config จาก Firebase Console ทับก้อนนี้ (ปล่อยเป็น null = โหมดทดลอง) ▼▼▼ */
window.FIREBASE_CONFIG = null;
/* ▲▲▲ จบส่วนที่ต้องแก้ ▲▲▲ */
</script>

<script>
const APP_VERSION = '1.3.0';
const ROOT = 'data/training';
const DEMO_KEY = 'lasc-training-demo-v1';
const DEMO_USER_KEY = 'lasc-training-demo-user';

let fb = null;          // ฟังก์ชัน Firebase (null = ยังไม่พร้อม หรือโหมดทดลอง)
let DEMO = false;       // true = ไม่มี FIREBASE_CONFIG → เก็บข้อมูลใน localStorage
let me = null;          // { uid, email, name }
let myRole = null;      // 'admin' | 'staff' | null (= ผู้เรียน)
let C = {}, SES = {}, SET = {}, ENR = {}, PROF = {}, CERTS = {}, ALLOWED = {};
let MYPROF = null;
let pubUnsubs = [], userUnsubs = [];
let view = { tab: 'catalog', enrKey: null, lessonId: null, sessionId: null };
let filt = { q: '', type: '', course: '', status: '' };
let certFilt = { q: '' };
let _afterLogin = null;
let _busy = false;

const DEFAULT_SETTINGS = {
  orgName: 'ศูนย์บริการสัตว์ทดลอง มหาวิทยาลัยสงขลานครินทร์',
  orgNameEn: 'Laboratory Animal Service Center, Prince of Songkla University',
  signer1Name: '', signer1Title: 'ผู้อำนวยการศูนย์บริการสัตว์ทดลอง', signer1Sig: '',
  signer2Name: '', signer2Title: '', signer2Sig: '',
  signer1NameEn: '', signer1TitleEn: 'Director, Laboratory Animal Service Center', signer2NameEn: '', signer2TitleEn: '',
  regPrefix: 'REG', certPrefixMooc: 'LASC-T', certPrefixPrac: 'LASC-P',
  moocAutoCert: true,
  payBank: '', payAccName: '', payAccNo: '', payPromptPay: '', payNote: '',
  contact: '',
  receiptTitle: 'ใบเสร็จรับเงิน', receiptPrefix: 'RC', receiptAuto: true, receiptSignerName: '', receiptSignerTitle: 'ผู้รับเงิน',
  orgAddress: '', orgTaxId: '', receiptNote: '',
  mailUrl: ''
};

/* ---------- เครื่องมือทั่วไป ---------- */
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2800);
}
function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function beYear(iso) { return (iso ? Number(String(iso).slice(0,4)) : new Date().getFullYear()) + 543; }
function addYears(iso, n) { const p = iso.split('-'); return (Number(p[0]) + Number(n)) + '-' + p[1] + '-' + p[2]; }
const TH_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function thaiDate(iso) {
  if (!iso) return '-';
  const p = String(iso).slice(0,10).split('-'); if (p.length !== 3) return esc(iso);
  return Number(p[2]) + ' ' + TH_MONTHS[Number(p[1])-1] + ' ' + (Number(p[0]) + 543);
}
function thaiDateLong(iso) {
  if (!iso) return '-';
  const p = String(iso).slice(0,10).split('-'); if (p.length !== 3) return esc(iso);
  return Number(p[2]) + ' ' + TH_MONTHS_FULL[Number(p[1])-1] + ' พ.ศ. ' + (Number(p[0]) + 543);
}
function dateRange(a, b) { return (!b || b === a) ? thaiDate(a) : thaiDate(a) + ' – ' + thaiDate(b); }
function money(n) { return Number(n || 0).toLocaleString('th-TH') + ' บาท'; }
function num(v) { const n = Number(v); return isFinite(n) && n > 0 ? n : 0; }
function pad(n, w) { return String(n).padStart(w, '0'); }
function safeKey(s) { return String(s || '').trim().replace(/[.#$\[\]\/\s]/g, '-'); }
function fullName(i) { return [i && i.prefix, i && i.firstName].filter(Boolean).join('') + ' ' + ((i && i.lastName) || ''); }
function stamp() { return new Date().toISOString(); }
function readLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function writeLocal(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function isStaff() { return myRole === 'admin' || myRole === 'staff'; }
function isAdmin() { return myRole === 'admin'; }

/* ---------- ชั้นเก็บข้อมูล: Firebase หรือ localStorage (โหมดทดลอง) ----------
   path ปกติอยู่ใต้ ROOT · path ที่ขึ้นต้นด้วย '/' คือ path จากราก (เช่น /allowed) */
function fullPath(p) { return p.charAt(0) === '/' ? p.slice(1) : (p ? ROOT + '/' + p : ROOT); }
const DemoDB = {
  data: null, listeners: [], _t: null,
  load() {
    try { this.data = JSON.parse(readLocal(DEMO_KEY) || 'null'); } catch (e) { this.data = null; }
    if (!this.data) { this.data = {}; seedDemo(); this.save(); }
  },
  save() {
    try { localStorage.setItem(DEMO_KEY, JSON.stringify(this.data)); }
    catch (e) { toast('พื้นที่เก็บข้อมูลของเบราว์เซอร์เต็ม — ข้อมูลทดลองอาจไม่ถูกบันทึก'); }
  },
  seg(p) { return fullPath(p).split('/').filter(Boolean); },
  at(p) { let o = this.data; for (const s of this.seg(p)) { if (o == null || typeof o !== 'object') return null; o = o[s]; } return o === undefined ? null : o; },
  put(p, v) {
    const seg = this.seg(p); let o = this.data;
    for (let i = 0; i < seg.length - 1; i++) { if (o[seg[i]] == null || typeof o[seg[i]] !== 'object') o[seg[i]] = {}; o = o[seg[i]]; }
    const last = seg[seg.length - 1];
    if (v == null) delete o[last]; else o[last] = JSON.parse(JSON.stringify(v));
  },
  emit() {
    clearTimeout(this._t);
    this._t = setTimeout(() => this.listeners.forEach(l => { const v = this.at(l.path); l.cb(v == null ? null : JSON.parse(JSON.stringify(v))); }), 0);
  }
};
const S = {
  listen(path, cb) {
    if (DEMO) {
      const l = { path, cb }; DemoDB.listeners.push(l);
      setTimeout(() => { const v = DemoDB.at(path); cb(v == null ? null : JSON.parse(JSON.stringify(v))); }, 0);
      return () => { DemoDB.listeners = DemoDB.listeners.filter(x => x !== l); };
    }
    return fb.onValue(fb.ref(fb.db, fullPath(path)), (s) => cb(s.exists() ? s.val() : null), (e) => { console.warn('อ่านข้อมูลไม่ได้:', path, e && e.code); cb(null); });
  },
  async get(path) {
    if (DEMO) { const v = DemoDB.at(path); return v == null ? null : JSON.parse(JSON.stringify(v)); }
    const s = await fb.get(fb.ref(fb.db, fullPath(path))); return s.exists() ? s.val() : null;
  },
  async set(path, val) {
    if (DEMO) { DemoDB.put(path, val); DemoDB.save(); DemoDB.emit(); return; }
    return fb.set(fb.ref(fb.db, fullPath(path)), val);
  },
  /* อัปเดตหลายตำแหน่งพร้อมกัน — key เป็น path ย่อยใต้ ROOT */
  async multi(obj) {
    if (DEMO) { Object.keys(obj).forEach(k => DemoDB.put(k, obj[k])); DemoDB.save(); DemoDB.emit(); return; }
    return fb.update(fb.ref(fb.db, ROOT), obj);
  },
  newKey() {
    if (DEMO) return 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    return fb.push(fb.ref(fb.db, ROOT + '/_keys')).key;
  },
  /* ตัวนับเลขที่เรียงต่อเนื่อง (ปลอดภัยเมื่อหลายคนกดพร้อมกัน) */
  async counter(name) {
    if (DEMO) { const p = 'counters/' + name; const n = (Number(DemoDB.at(p)) || 0) + 1; DemoDB.put(p, n); DemoDB.save(); return n; }
    const r = await fb.runTransaction(fb.ref(fb.db, ROOT + '/counters/' + name), (cur) => (Number(cur) || 0) + 1);
    return r.snapshot.val();
  }
};
async function nextNo(prefix, counterName) {
  const be = beYear();
  const n = await S.counter(safeKey(counterName) + '-' + be);
  return safeKey(prefix) + '-' + be + '-' + pad(n, 4);
}

function authMessage(e) {
  const code = String(e && e.code || '');
  if (/operation-not-supported-in-this-environment|web-storage-unsupported/.test(code) || location.protocol === 'file:')
    return 'เปิดไฟล์จากเครื่องโดยตรงเข้าสู่ระบบไม่ได้ — ต้องเปิดจากเว็บ HTTPS';
  if (/unauthorized-domain/.test(code)) return 'โดเมน ' + location.hostname + ' ยังไม่ได้รับอนุญาต — เพิ่มใน Firebase Console → Authentication → Settings → Authorized domains';
  if (/operation-not-allowed/.test(code)) return 'ยังไม่ได้เปิดวิธีเข้าสู่ระบบนี้ใน Firebase Console → Authentication → Sign-in method';
  if (/invalid-credential|wrong-password|user-not-found|invalid-email/.test(code)) return 'อีเมลหรือรหัสผ่านไม่ถูกต้อง';
  if (/email-already-in-use/.test(code)) return 'อีเมลนี้สมัครไว้แล้ว — กด “เข้าสู่ระบบ” หรือ “ลืมรหัสผ่าน”';
  if (/weak-password/.test(code)) return 'รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร';
  if (/too-many-requests/.test(code)) return 'พยายามหลายครั้งเกินไป กรุณารอสักครู่';
  if (/network-request-failed/.test(code)) return 'เชื่อมต่ออินเทอร์เน็ตไม่ได้ ลองใหม่อีกครั้ง';
  return 'ไม่สำเร็จ: ' + (e && (e.message || code));
}
window.authMessage = authMessage;
async function doSignIn() {
  if (!fb) return fieldErr('ยังเชื่อมต่อระบบไม่สำเร็จ — รีเฟรชหน้าเว็บ');
  const email = $('loginEmail').value.trim(), pass = $('loginPass').value;
  if (!email || !pass) return fieldErr('กรอกอีเมลและรหัสผ่าน');
  $('loginBtn').disabled = true;
  try { await fb.signIn(fb.auth, email, pass); } catch (e) { fieldErr(authMessage(e)); }
  if ($('loginBtn')) $('loginBtn').disabled = false;
}
async function doSignUp() {
  if (!fb) return fieldErr('ยังเชื่อมต่อระบบไม่สำเร็จ — รีเฟรชหน้าเว็บ');
  const box = $('signupNameBox');
  if (box.classList.contains('hidden')) { box.classList.remove('hidden'); $('signupName').focus(); toast('กรอกชื่อ-นามสกุล แล้วกด “สมัครสมาชิกใหม่” อีกครั้ง'); return; }
  const email = $('loginEmail').value.trim(), pass = $('loginPass').value, name = $('signupName').value.trim();
  if (!email || !pass || !name) return fieldErr('กรอกอีเมล รหัสผ่าน และชื่อ-นามสกุลให้ครบ');
  $('signupBtn').disabled = true;
  try {
    const cred = await fb.signUp(fb.auth, email, pass);
    try { await fb.updateProfile(cred.user, { displayName: name }); } catch (e) {}
    if (me) { me.name = name; renderWho(); }
  } catch (e) { fieldErr(authMessage(e)); }
  if ($('signupBtn')) $('signupBtn').disabled = false;
}
async function doGoogle() {
  if (!fb) return fieldErr('ยังเชื่อมต่อระบบไม่สำเร็จ — รีเฟรชหน้าเว็บ');
  if (location.protocol === 'file:') return fieldErr(authMessage({}));
  const provider = new fb.GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });
  $('googleBtn').disabled = true;
  try { await fb.signInWithPopup(fb.auth, provider); }
  catch (e) {
    const code = String(e && e.code || '');
    if (/popup-blocked/.test(code)) { try { await fb.signInWithRedirect(fb.auth, provider); return; } catch (e2) { e = e2; } }
    if (!/popup-closed-by-user|cancelled-popup-request/.test(code)) fieldErr(authMessage(e));
  }
  if ($('googleBtn')) $('googleBtn').disabled = false;
}
async function doReset() {
  const email = ($('loginEmail') || {}).value;
  if (!email) return fieldErr('กรอกอีเมลก่อน แล้วกด “ลืมรหัสผ่าน”');
  try { await fb.resetPassword(fb.auth, email.trim()); toast('ส่งลิงก์ตั้งรหัสผ่านใหม่ไปที่ ' + email + ' แล้ว'); }
  catch (e) { fieldErr(authMessage(e)); }
}
function doSignOut() {

/* เรียกเมื่อสถานะผู้ใช้เปลี่ยน (ทั้ง Firebase และโหมดทดลอง) */
async function onUser(u) {
  userUnsubs.forEach(f => { try { f(); } catch (e) {} }); userUnsubs = [];
  ENR = {}; PROF = {}; CERTS = {}; ALLOWED = {}; MYPROF = null; myRole = null;
  me = u ? { uid: u.uid, email: u.email || '', name: u.name || u.displayName || '' } : null;
  if (me) {
    let r = null;
    try { r = await S.get('/allowed/' + me.uid); } catch (e) { r = null; }
    myRole = r === 'admin' ? 'admin' : r ? 'staff' : null;
    if (isStaff()) {
      userUnsubs.push(S.listen('enrollments', v => { ENR = v || {}; renderAll(); }));
      userUnsubs.push(S.listen('profiles', v => { PROF = v || {}; MYPROF = PROF[me.uid] || null; renderAll(); }));
      userUnsubs.push(S.listen('certs', v => { CERTS = v || {}; renderAll(); }));
      if (isAdmin()) userUnsubs.push(S.listen('/allowed', v => { ALLOWED = v || {}; renderAll(); }));
    } else {
      userUnsubs.push(S.listen('enrollments/' + me.uid, v => { ENR = {}; ENR[me.uid] = v || {}; renderAll(); }));
      userUnsubs.push(S.listen('profiles/' + me.uid, v => { MYPROF = v; renderAll(); }));
    }
    if (!$('modalBg').classList.contains('hidden') && /เข้าสู่ระบบ/.test($('modalTitle').textContent)) closeModal();
    if (view.tab === 'catalog' && isStaff() && !_afterLogin) view.tab = 'dash';
  } else {
    if (['catalog', 'verify'].indexOf(view.tab) < 0) view.tab = 'catalog';
  }
  renderWho(); renderTabs(); renderAll();
  if (me && _afterLogin) { const f = _afterLogin; _afterLogin = null; setTimeout(f, 300); }
}

/* ---------- ข้อมูลหลักสูตร / การลงทะเบียน ---------- */
function courseList(type) {
  return Object.keys(C || {}).map(k => Object.assign({}, C[k], { id: k }))
    .filter(c => !type || c.type === type)
    .sort((a, b) => String(a.code || '').localeCompare(String(b.code || '')) || String(a.title).localeCompare(String(b.title)));
}
function sessionList(courseId) {
  return Object.keys(SES || {}).map(k => Object.assign({}, SES[k], { id: k }))
    .filter(s => !courseId || s.courseId === courseId)
    .sort((a, b) => String(a.dateStart || '').localeCompare(String(b.dateStart || '')));
}
function seatsUsed(s) { return Object.keys((s && s.seats) || {}).length; }
function arr(v) { return Array.isArray(v) ? v.filter(Boolean) : v && typeof v === 'object' ? Object.keys(v).sort((a, b) => Number(a) - Number(b)).map(k => v[k]).filter(Boolean) : []; }
function lessonsOf(c) { return arr(c && c.lessons); }
function quizOf(c) { return arr(c && c.quiz); }
function passScoreOf(c) { return c && c.passScore != null && c.passScore !== '' ? Number(c.passScore) : 70; }
function enrList() {
  const out = [];
  Object.keys(ENR || {}).forEach(uid => Object.keys(ENR[uid] || {}).forEach(eid => {
    const e = ENR[uid][eid];
    if (e && e.info) out.push(Object.assign({}, e, { _uid: uid, _id: eid, _key: uid + '/' + eid }));
  }));
  return out;
}
function getEnr(key) {

async function submitRegister(courseId, sessionId, needNote) {
  if (_busy) return;
  const g = (id) => ($(id) ? $(id).value.trim() : '');
  const f = { prefix: g('rPrefix'), firstName: g('rFirst'), lastName: g('rLast'), firstNameEn: g('rFirstEn'), lastNameEn: g('rLastEn'),
    phone: g('rPhone'), org: g('rOrg'), position: g('rPos'), idNo: g('rIdNo'), applicantType: regType() };
  if (!f.prefix || !f.firstName || !f.lastName || !f.phone || !f.org) return fieldErr('กรอกช่องที่มีเครื่องหมาย * ให้ครบ');
  const prereqNote = needNote ? g('rPrereq') : '';
  if (needNote && !prereqNote) return fieldErr('ระบุหลักฐานการผ่านภาคทฤษฎีจากหน่วยงานอื่น');
  if (!$('rConsent').checked) return fieldErr('กรุณาทำเครื่องหมายยืนยันข้อมูลและให้ความยินยอม');
  const c = C[courseId], s = sessionId ? SES[sessionId] : null;
  if (s) { const err = sessionOpenErr(s); if (err) return fieldErr(err); }
  const amount = f.applicantType === 'psu' ? num(c.feeInternal) : num(c.feeExternal);
  _busy = true; $('rSubmit').disabled = true;
  try {
    const regNo = await nextNo(SET.regPrefix || 'REG', 'reg');
    const eid = S.newKey();
    const info = Object.assign({}, f, {
      regNo: regNo, courseId: courseId, courseCode: c.code || '', courseTitle: c.title, type: c.type, hours: num(c.hours),
      sessionId: sessionId || '', sessionDate: s ? s.dateStart || '' : '', sessionDateEnd: s ? (s.dateEnd || s.dateStart || '') : '',
      batchNo: s ? s.batchNo || '' : '', email: me.email, prereqNote: prereqNote, createdAt: stamp()
    });
    const up = {};
    up['enrollments/' + me.uid + '/' + eid + '/info'] = info;
    up['enrollments/' + me.uid + '/' + eid + '/pay'] = { amount: amount, status: amount > 0 ? 'unpaid' : 'none' };
    up['profiles/' + me.uid] = Object.assign({}, f, { email: me.email, updatedAt: stamp() });
    if (sessionId) up['sessions/' + sessionId + '/seats/' + me.uid] = eid;
    await S.multi(up);
    closeModal();
    toast('ลงทะเบียนสำเร็จ เลขที่ ' + regNo);
    go('my');
    /* ส่งอีเมลยืนยัน + แจ้งแอดมิน (ไม่ต้องรอ — ถ้าส่งไม่ได้ การลงทะเบียนยังสมบูรณ์) */
    notifyRegistration(me.uid, eid).then(j => {
      if (j && j.to) setTimeout(() => toast('📧 ส่งอีเมลยืนยันไปที่ ' + j.to + ' แล้ว'), 1500);
    }).catch(() => {});
  } catch (e) { fieldErr('ลงทะเบียนไม่สำเร็จ: ' + (e && (e.code || e.message))); }
  _busy = false; if ($('rSubmit')) $('rSubmit').disabled = false;
}

function compressImage(file, maxW, q) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('อ่านไฟล์ไม่ได้'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('ไฟล์นี้ไม่ใช่รูปภาพ'));
      img.onload = () => {
        const sc = Math.min(1, maxW / Math.max(img.width, img.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        const cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL(q ? 'image/jpeg' : 'image/png', q || undefined));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function embedVideo(url) {
  url = String(url || '').trim(); if (!url) return '';
  let m, src = '';
  if ((m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/))) src = 'https://www.youtube.com/embed/' + m[1] + '?rel=0';
  else if ((m = url.match(/drive\.google\.com\/(?:file\/d\/|open\?id=)([\w-]+)/))) src = 'https://drive.google.com/file/d/' + m[1] + '/preview';
  else if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/))) src = 'https://player.vimeo.com/video/' + m[1];
  else if (/\.(mp4|webm|ogg)(\?|$)/i.test(url)) return '<div class="video"><video controls preload="metadata" src="' + esc(url) + '"></video></div>';
  if (src) return '<div class="video"><iframe src="' + esc(src) + '" allow="accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>';
  return '<p><a class="btn secondary" href="' + esc(url) + '" target="_blank" rel="noopener">▶ เปิดสื่อการเรียน</a></p>';
}
function lessonUnlocked(e, c, idx) {

async function markLessonDone(key, lessonId) {

  const done = Object.assign({}, (e.progress && e.progress.done) || {}); done[lessonId] = true;
  const up = {}; const base = enrPath(e) + '/progress';
  up[base + '/done/' + lessonId] = true;
  if (!e.progress || !e.progress.startedAt) up[base + '/startedAt'] = stamp();
  const allDone = ls.every(l => done[l.id]);
  if (allDone && !quizOf(c).length) { up[base + '/best'] = 100; up[base + '/passedAt'] = stamp(); }
  try {
    await S.multi(up);
    const idx = ls.findIndex(l => l.id === lessonId);
    if (idx < ls.length - 1) view.lessonId = ls[idx + 1].id; else view.lessonId = quizOf(c).length ? '__quiz' : '__cert';
    setTimeout(() => { renderPlayerSide(); renderPlayerMain(); window.scrollTo({ top: 0, behavior: 'smooth' }); }, 60);
    if (allDone && !quizOf(c).length) setTimeout(() => maybeAutoCert(key), 250);
  } catch (err) { toast('บันทึกไม่สำเร็จ: ' + (err.code || err.message)); if ($('doneBtn')) $('doneBtn').disabled = false; }
}
function openQuiz(key) {
  const e = getEnr(key); if (!e) return; const c = C[e.info.courseId], q = quizOf(c);
  const order = q.map((x, i) => i);
  if (c.shuffle !== false) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = order[i]; order[i] = order[j]; order[j] = t; }
  openQuiz._order = order;
  openModal('แบบทดสอบหลังเรียน — ' + c.title,
    '<div class="alert info small">ตอบให้ครบทุกข้อ เกณฑ์ผ่าน ' + passScoreOf(c) + '%</div>' +
    order.map((qi, n) => '<div class="quiz-q"><div class="qt">' + (n + 1) + '. ' + esc(q[qi].q) + '</div>' +
      arr(q[qi].choices).map((ch, ci) => '<label><input type="radio" name="q' + qi + '" value="' + ci + '"> <span>' + esc(ch) + '</span></label>').join('') + '</div>').join('') +
    '<div id="mErr" class="alert err hidden"></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">ยกเลิก</button><button class="btn mooc" id="qSubmit" onclick="submitQuiz(\'' + key + '\')">ส่งคำตอบ</button></div>', { wide: true });
}
async function submitQuiz(key) {
  if (_busy) return;
  const e = getEnr(key); if (!e) return; const c = C[e.info.courseId], q = quizOf(c);
  let correct = 0, blank = 0;
  q.forEach((x, i) => { const r = document.querySelector('input[name=q' + i + ']:checked'); if (!r) blank++; else if (Number(r.value) === Number(x.answer)) correct++; });
  if (blank) return fieldErr('ยังไม่ได้ตอบ ' + blank + ' ข้อ');
  const score = Math.round(correct * 100 / q.length), pass = score >= passScoreOf(c);
  const p = e.progress || {}, base = enrPath(e) + '/progress', up = {};
  up[base + '/attempts'] = num(p.attempts) + 1;
  up[base + '/last'] = score; up[base + '/lastAt'] = stamp();
  if (p.best == null || score > Number(p.best)) up[base + '/best'] = score;
  if (pass && !p.passedAt) up[base + '/passedAt'] = stamp();
  _busy = true; $('qSubmit').disabled = true;
  try {
    await S.multi(up);
    $('modalBody').innerHTML = '<div style="text-align:center;padding:10px 0"><div style="font-size:46px">' + (pass ? '🎉' : '📖') + '</div>' +
      '<div style="font-size:30px;font-weight:700;color:' + (pass ? 'var(--accent)' : 'var(--danger)') + '">' + score + '%</div>' +
      '<p>ตอบถูก ' + correct + ' จาก ' + q.length + ' ข้อ — <b>' + (pass ? 'ผ่านเกณฑ์' : 'ยังไม่ผ่านเกณฑ์ (' + passScoreOf(c) + '%)') + '</b></p>' +
      (pass ? '' : '<p class="muted small">ทบทวนบทเรียนแล้วทำแบบทดสอบใหม่ได้</p>') + '</div>' +
      '<div class="modal-foot"><button class="btn ' + (pass ? 'ok' : 'mooc') + '" onclick="closeModal();openLesson(\'' + (pass ? '__cert' : '__quiz') + '\')' + (pass ? ';maybeAutoCert(\'' + key + '\')' : '') + '">' + (pass && SET.moocAutoCert !== false ? 'ไปออกใบรับรอง' : 'ตกลง') + '</button></div>';

  } catch (err) { fieldErr('ส่งคำตอบไม่สำเร็จ: ' + (err.code || err.message)); if ($('qSubmit')) $('qSubmit').disabled = false; }

}
function maybeAutoCert(key) {

}
/* ผู้เรียน MOOC ออกใบรับรองเอง — ต้องกรอกชื่อภาษาอังกฤษก่อนทุกครั้ง */

/* ---------- กรอกชื่อ-นามสกุลภาษาอังกฤษก่อนออกใบรับรอง (บังคับทุกครั้ง ไม่ดึงค่าเดิมมาใส่ให้) ---------- */
const EN_TITLES = ['Mr.', 'Mrs.', 'Ms.', 'Miss', 'Dr.', 'Asst. Prof.', 'Asst. Prof. Dr.', 'Assoc. Prof.', 'Assoc. Prof. Dr.', 'Prof.', 'Prof. Dr.'];

    '<div id="mErr" class="alert err hidden"></div>' +
    list.map((e, n) => {

function cnPreview(n) {

async function cnSubmit() {

const _issuing = {};
async function issueCert(key, en) {
  if (!en || !en.firstNameEn || !en.lastNameEn) throw new Error('ต้องกรอกชื่อ-นามสกุลภาษาอังกฤษก่อนออกใบรับรอง');
  const e = getEnr(key); if (!e || e.cert || _issuing[key]) return null;
  _issuing[key] = true;
  try {
    const c = C[e.info.courseId] || {}, i = e.info, isM = i.type === 'mooc';
    const no = await nextNo(isM ? (SET.certPrefixMooc || 'LASC-T') : (SET.certPrefixPrac || 'LASC-P'), 'cert-' + (isM ? 'mooc' : 'prac'));
    const issuedAt = todayISO();
    const validUntil = num(c.validYears) ? addYears(issuedAt, num(c.validYears)) : '';
    const by = { by: me.uid, byName: me.name || me.email };
    const nm = { titleEn: en.titleEn || '', firstNameEn: en.firstNameEn, lastNameEn: en.lastNameEn, nameEn: [en.titleEn, en.firstNameEn, en.lastNameEn].filter(Boolean).join(' ') };
    const rec = Object.assign({
      uid: e._uid, eid: e._id, regNo: i.regNo || '', name: fullName(i).trim(),
      org: i.org || '', courseId: i.courseId, courseCode: i.courseCode || c.code || '', courseTitle: i.courseTitle || c.title || '',
      courseTitleEn: c.titleEn || '', type: i.type, hours: num(i.hours || c.hours), sessionDate: i.sessionDate || '', sessionDateEnd: i.sessionDateEnd || '',
      batchNo: i.batchNo || '', issuedAt: issuedAt, validUntil: validUntil, by: by.by, byName: by.byName
    }, nm);
    const up = {};
    up[enrPath(e) + '/cert'] = Object.assign({ no: no, issuedAt: issuedAt, validUntil: validUntil }, nm, by);
    up['certs/' + no] = rec;
    await S.multi(up);
    return no;
  } finally { delete _issuing[key]; }
}
function certRecFromEnr(e) {
  const c = C[e.info.courseId] || {}, i = e.info;
  return Object.assign({ no: e.cert.no, name: fullName(i).trim(), nameEn: [i.firstNameEn, i.lastNameEn].filter(Boolean).join(' '), org: i.org,
    courseCode: i.courseCode, courseTitle: i.courseTitle, courseTitleEn: c.titleEn || '', type: i.type, hours: i.hours, sessionDate: i.sessionDate,
    sessionDateEnd: i.sessionDateEnd, batchNo: i.batchNo, regNo: i.regNo }, CERTS[e.cert.no] || {}, e.cert, { no: e.cert.no });
}
function printCertByKey(key) { const e = getEnr(key); if (e && e.cert) printCert(certRecFromEnr(e)); }

function passWithCert(keys) {
  const list = keys.map(getEnr).filter(e => e && !e.result && !e.cert && !e.cancel && (e.info.type !== 'practical' || (e.att && e.att.present)));
  if (!list.length) { toast('บันทึกการมาเรียนก่อน'); return; }
  const unpaid = list.filter(e => !payOK(e));
  if (unpaid.length && !confirm((list.length > 1 ? 'ในจำนวนนี้ ' + unpaid.length + ' คน' : fullName(list[0].info)) + ' ยังไม่ได้ชำระเงิน\nบันทึกผ่านและออกใบรับรองต่อหรือไม่?')) return;
  openCertNameDialog(list.map(e => e._key), { mode: 'pass', onConfirm: async (names) => {
    let ok = 0, last = '';
    for (const n of names) { if (await setResult(n.key, true, true, n)) { ok++; last = (getEnr(n.key).cert || {}).no || last; } }
    toast(ok === 1 ? 'ผ่านการฝึก · ออกใบรับรองเลขที่ ' + last : 'บันทึกผ่านและออกใบรับรอง ' + ok + ' คน');
  } });
}
async function setResult(key, passed, silent, en) {
  const e = getEnr(key); if (!e || e.result || e.cert) return false;
  if (e.info.type === 'practical' && !(e.att && e.att.present)) { toast('บันทึกการมาเรียนก่อน'); return false; }
  let note = '';
  if (passed) {
    if (!en) { passWithCert([key]); return false; }
  } else {
    const r = prompt('บันทึกว่า ' + fullName(e.info) + ' “ไม่ผ่าน”\nเหตุผล / ข้อเสนอแนะ (ผู้เรียนจะเห็น):', ''); if (r === null) return false; note = r.trim();
  }
  try {
    await S.set(enrPath(e) + '/result', { passed: !!passed, note: note, at: stamp(), by: me.uid, byName: me.name || me.email });
    if (passed) {
      await waitFor(() => { const x = getEnr(key); return x && x.result; });
      const no = await issueCert(key, en);
      if (!silent && no) toast('ผ่านการฝึก · ออกใบรับรองเลขที่ ' + no);
    }
    return true;
  } catch (err) { toast('บันทึกไม่สำเร็จ: ' + (err.code || err.message)); return false; }
}
function waitFor(fn, ms) {
  return new Promise(res => { const t0 = Date.now(); (function chk() { if (fn() || Date.now() - t0 > (ms || 3000)) res(); else setTimeout(chk, 50); })(); });
}

function syncCE() {
  const c = _ce.c, g = (id) => ($(id) ? $(id).value : undefined);
  const set = (k, id, f) => { const x = g(id); if (x !== undefined) c[k] = f ? f(x) : x.trim(); };
  set('code', 'ceCode'); set('title', 'ceTitle'); set('titleEn', 'ceTitleEn'); set('description', 'ceDesc');
  set('hours', 'ceHours', num); set('feeInternal', 'ceFeeIn', num); set('feeExternal', 'ceFeeEx', num); set('validYears', 'ceValid', num);
  set('passScore', 'cePass', x => Math.min(100, num(x))); set('maxAttempts', 'ceMaxA', num); set('prereq', 'cePrereq');
  if ($('ceShuffle')) c.shuffle = $('ceShuffle').checked;
  if ($('ceActive')) c.active = $('ceActive').checked;
  c.lessons.forEach((l, i) => { if (!$('lT' + i)) return; l.title = g('lT' + i).trim(); l.minutes = num(g('lM' + i)); l.videoUrl = g('lV' + i).trim(); l.content = g('lC' + i); l.fileUrl = g('lF' + i).trim(); });
  c.quiz.forEach((q, i) => {
    if (!$('qQ' + i)) return;
    q.q = g('qQ' + i).trim();
    const n = Math.max(q.choices.length, 4), ch = [];
    for (let j = 0; j < n; j++) ch.push($('qC' + i + '_' + j) ? g('qC' + i + '_' + j) : (q.choices[j] || ''));
    q.choices = ch;
    const r = document.querySelector('input[name=qA' + i + ']:checked'); q.answer = r ? Number(r.value) : null;
  });
}
function ceAdd(kind) { syncCE(); if (kind === 'lessons') _ce.c.lessons.push({ id: newLessonId(), title: '', videoUrl: '', content: '' }); else _ce.c.quiz.push({ q: '', choices: ['', '', '', ''], answer: null }); renderCE(); }
function ceDel(kind, i) { if (!confirm('ลบรายการนี้?')) return; syncCE(); _ce.c[kind].splice(i, 1); renderCE(); }
function ceMove(kind, i, d) { syncCE(); const a = _ce.c[kind], t = a[i]; a[i] = a[i + d]; a[i + d] = t; renderCE(); }
function ceAddChoice(i) { syncCE(); const q = _ce.c.quiz[i]; while (q.choices.length < 4) q.choices.push(''); q.choices.push(''); renderCE(); }
function ceImportBox() { $('ceImport').classList.toggle('hidden'); }
function ceImport() {
  syncCE();
  const blocks = $('ceImportTxt').value.replace(/\r/g, '').split(/\n\s*\n/).map(b => b.split('\n').map(x => x.trim()).filter(Boolean)).filter(b => b.length >= 3);
  let added = 0;
  blocks.forEach(b => {
    const q = b[0].replace(/^\d+[\.\)]\s*/, ''); let answer = null;
    const choices = b.slice(1).map((x, j) => { if (/^\*/.test(x)) { answer = j; x = x.replace(/^\*\s*/, ''); } return x.replace(/^([ก-ฮ]|[a-dA-D]|[1-6])[\.\)]\s*/, ''); });
    _ce.c.quiz.push({ q: q, choices: choices, answer: answer }); added++;
  });
  renderCE(); toast('เพิ่มข้อสอบ ' + added + ' ข้อ' + (added ? ' — ตรวจคำตอบที่ถูกอีกครั้ง' : ''));
}
async function saveCourse() {
  syncCE();
  const c = _ce.c;
  if (!c.title) return fieldErr('กรอกชื่อหลักสูตร');
  if (c.type === 'mooc') {
    c.lessons = c.lessons.filter(l => l.title || l.videoUrl || l.content);
    for (let i = 0; i < c.lessons.length; i++) { if (!c.lessons[i].title) return fieldErr('บทที่ ' + (i + 1) + ' ยังไม่มีชื่อ'); if (!c.lessons[i].id) c.lessons[i].id = newLessonId(); }
    if (!c.lessons.length) return fieldErr('หลักสูตร MOOC ต้องมีบทเรียนอย่างน้อย 1 บท');
    const qs = [];
    for (let i = 0; i < c.quiz.length; i++) {
      const q = c.quiz[i]; if (!q.q) continue;
      const keep = []; let ans = null;
      q.choices.forEach((x, j) => { if (String(x).trim()) { if (j === q.answer) ans = keep.length; keep.push(String(x).trim()); } });
      if (keep.length < 2) return fieldErr('ข้อสอบข้อ ' + (i + 1) + ' ต้องมีตัวเลือกอย่างน้อย 2 ตัว');
      if (ans === null) return fieldErr('ข้อสอบข้อ ' + (i + 1) + ' ยังไม่ได้เลือกคำตอบที่ถูก');
      qs.push({ q: q.q, choices: keep, answer: ans });
    }
    c.quiz = qs;
  } else { delete c.lessons; delete c.quiz; }
  const out = Object.assign({}, c, { hours: num(c.hours), feeInternal: num(c.feeInternal), feeExternal: num(c.feeExternal), validYears: num(c.validYears), updatedAt: stamp() });
  delete out.id;
  if (!_ce.id) out.createdAt = stamp();
  const id = _ce.id || S.newKey();
  try { await S.set('courses/' + id, out); closeModal(); toast('บันทึกหลักสูตรแล้ว'); } catch (e) { fieldErr('บันทึกไม่สำเร็จ: ' + (e.code || e.message)); }
}

/* ---------- เงินเป็นตัวอักษร ---------- */
function bahtText(n) {
  n = Math.round(Number(n || 0) * 100) / 100;
  const D = ['ศูนย์', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  const rd = (s) => {
    s = String(s).replace(/^0+/, ''); let o = ''; const L = s.length;
    for (let i = 0; i < L; i++) {
      const d = +s[i], p = L - i - 1; if (!d) continue;
      if (p === 1 && d === 1) o += 'สิบ'; else if (p === 1 && d === 2) o += 'ยี่สิบ';
      else if (p === 0 && d === 1 && L > 1) o += 'เอ็ด'; else o += D[d] + P[p];
    }
    return o;
  };
  const conv = (s) => { s = String(s).replace(/^0+/, ''); if (!s) return ''; return s.length > 6 ? conv(s.slice(0, -6)) + 'ล้าน' + rd(s.slice(-6)) : rd(s); };
  const ip = Math.floor(n), st = Math.round((n - ip) * 100);
  return (ip ? conv(ip) + 'บาท' : st ? '' : 'ศูนย์บาท') + (st ? rd(st) + 'สตางค์' : 'ถ้วน');
}

let memFilt = { q: '', type: '', flag: '' };
function memberList() {
  const map = {};
  const get = (uid) => map[uid] || (map[uid] = { uid: uid, p: null, enrs: [] });
  Object.keys(PROF || {}).forEach(u => { if (PROF[u]) get(u).p = PROF[u]; });
  enrList().forEach(e => get(e._uid).enrs.push(e));
  return Object.keys(map).map(u => {
    const m = map[u];
    m.enrs.sort((a, b) => String(b.info.createdAt || '').localeCompare(String(a.info.createdAt || '')));
    const latest = (m.enrs[0] || {}).info || {};
    m.info = Object.assign({}, latest, m.p || {});
    m.name = fullName(m.info).trim() || m.info.email || u;
    m.active = m.enrs.filter(e => !e.cancel);
    m.certs = m.enrs.filter(e => e.cert && !e.cert.revoked).length;
    m.owe = m.active.filter(e => !payOK(e) && (e.pay || {}).status !== 'refunded').reduce((s, e) => s + num(e.pay.amount), 0);
    m.last = (m.enrs[0] || {}).info ? m.enrs[0].info.createdAt : (m.p || {}).updatedAt || '';
    m.manual = /^manual-/.test(u);
    return m;
  }).filter(m => !ALLOWED[m.uid] || m.enrs.length);
}

async function submitManualEnroll(uid) {
  if (_busy) return;
  const p = readPerson('me');
  if (!p.prefix || !p.firstName || !p.lastName) return fieldErr('กรอกคำนำหน้า ชื่อ และนามสกุล');
  const c = C[$('meCourse').value]; if (!c) return fieldErr('เลือกหลักสูตร');
  const sid = c.type === 'practical' ? $('meSess').value : '';
  if (c.type === 'practical' && !sid) return fieldErr('หลักสูตรนี้ยังไม่มีรอบฝึก — เพิ่มรอบก่อน');
  if (c.type === 'mooc' && (!uid || /^manual-/.test(uid))) return fieldErr('MOOC ต้องเรียนผ่านบัญชีของผู้เรียนเอง — ให้ผู้เรียนสมัครสมาชิกก่อน แล้วลงทะเบียนให้จากหน้ารายชื่อ');
  const s = sid ? SES[sid] : null;
  const dup = enrList().find(e => e._uid === uid && !e.cancel && e.info.courseId === c.id && (c.type === 'mooc' || e.info.sessionId === sid));
  if (dup) return fieldErr('ผู้เรียนลงทะเบียนรายการนี้อยู่แล้ว (' + dup.info.regNo + ')');
  if (s && sessionOpenErr(s) && !confirm('รอบนี้: ' + sessionOpenErr(s) + '\nเจ้าหน้าที่ลงทะเบียนให้ต่อหรือไม่?')) return;
  const amount = num($('meAmt').value), payMode = $('mePay').value;
  _busy = true; $('meSubmit').disabled = true;
  try {
    const u = uid || ('manual-' + S.newKey());
    const regNo = await nextNo(SET.regPrefix || 'REG', 'reg');
    const eid = S.newKey(), by = me.name || me.email;
    const info = Object.assign({}, p, { regNo: regNo, courseId: c.id, courseCode: c.code || '', courseTitle: c.title, type: c.type, hours: num(c.hours),
      sessionId: sid, sessionDate: s ? s.dateStart || '' : '', sessionDateEnd: s ? (s.dateEnd || s.dateStart || '') : '', batchNo: s ? s.batchNo || '' : '',
      prereqNote: '', createdAt: stamp(), byStaff: by, staffRemark: $('meNote').value.trim() });
    let pay = { amount: amount, status: amount > 0 ? 'unpaid' : 'none' };
    if (amount > 0 && payMode === 'paid') {
      let rc = $('meRc').value.trim();
      if (!rc && SET.receiptAuto !== false) rc = await nextNo(SET.receiptPrefix || 'RC', 'receipt');
      pay = { amount: amount, status: 'paid', paidDate: todayISO(), paidAmount: amount, payMethod: 'ชำระที่ศูนย์ฯ', receiptNo: rc, verifiedBy: me.uid, verifiedByName: by, verifiedAt: stamp() };
    } else if (amount > 0 && payMode === 'waived') pay = { amount: amount, status: 'waived', waiveReason: $('meNote').value.trim(), verifiedBy: me.uid, verifiedByName: by, verifiedAt: stamp() };
    const up = {};
    up['enrollments/' + u + '/' + eid + '/info'] = info;
    up['enrollments/' + u + '/' + eid + '/pay'] = pay;
    if (sid) up['sessions/' + sid + '/seats/' + u] = eid;
    if (!PROF[u]) up['profiles/' + u] = Object.assign({}, p, { updatedAt: stamp(), createdByStaff: by });
    await S.multi(up);
    const mailT = $('meMail').checked && /^[^\s@,]+@[^\s@,]+\.[^\s@,]+$/.test(p.email || ''), mailA = $('meMailAdmin').checked;
    closeModal(); toast('ลงทะเบียนแล้ว เลขที่ ' + regNo);
    if (mailT || mailA) notifyRegistration(u, eid, { notifyTrainee: mailT, notifyAdmin: mailA })
      .then(j => { if (j && (j.to || j.admin)) setTimeout(() => toast('📧 ส่งอีเมล' + (j.to ? 'ถึง ' + j.to : 'แจ้งแอดมิน') + ' แล้ว'), 1500); })
      .catch(err => toast('ลงทะเบียนแล้ว แต่ส่งอีเมลไม่สำเร็จ: ' + (err.message || err)));
  } catch (err) { fieldErr('ลงทะเบียนไม่สำเร็จ: ' + (err.code || err.message)); }
  _busy = false; if ($('meSubmit')) $('meSubmit').disabled = false;
}

/* ====================== อีเมลแจ้งเตือน (ผ่าน Google Apps Script) ====================== */
function withTimeout(p, ms, msg) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(msg)), ms))]); }
async function callMailer(body) {
  const url = String(SET.mailUrl || '').trim();
  if (!url) throw new Error('ยังไม่ได้ตั้งค่า Mailer URL');
  const res = await withTimeout(fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }),
    30000, 'หมดเวลาเชื่อมต่อสคริปต์ส่งอีเมล');
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('สคริปต์ตอบกลับไม่ถูกต้อง — ตรวจว่า Deploy เป็น Web app และให้ Anyone เข้าถึงได้'); }
  if (!j.ok) throw new Error(j.error || 'ส่งไม่สำเร็จ');
  return j;
}
/* ส่งอีเมลยืนยันถึงผู้ลงทะเบียน + แจ้งแอดมิน แล้วบันทึกผลไว้ที่ enrollments/{uid}/{eid}/mail */
async function notifyRegistration(uid, eid, opt) {
  opt = opt || {};
  const path = 'enrollments/' + uid + '/' + eid + '/mail';
  if (DEMO) { await S.set(path, { demo: true, at: stamp() }); return { demo: true }; }
  if (!SET.mailUrl) return { skipped: true };
  try {
    const idToken = await fb.auth.currentUser.getIdToken();
    const j = await callMailer({ type: 'registration', idToken: idToken, uid: uid, eid: eid, resend: !!opt.resend,
      notifyTrainee: opt.notifyTrainee !== false, notifyAdmin: opt.notifyAdmin !== false });
    if (!j.duplicate) await S.set(path, { sentAt: stamp(), to: j.to || '', admin: !!j.admin, by: opt.resend ? (me.name || me.email) : '' }).catch(() => {});
    return j;
  } catch (e) {
    await S.set(path, { error: String(e.message || e).slice(0, 300), at: stamp() }).catch(() => {});
    throw e;
  }
}

const EN_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function enDate(iso) {
  const p = String(iso || '').slice(0, 10).split('-'); if (p.length !== 3) return '';
  return Number(p[2]) + ' ' + EN_MONTHS[Number(p[1]) - 1] + ' ' + p[0];
}
function enDateRange(a, b) {
  if (!b || b === a) return enDate(a);
  const x = a.split('-'), y = b.split('-');
  if (x[0] === y[0] && x[1] === y[1]) return Number(x[2]) + '–' + Number(y[2]) + ' ' + EN_MONTHS[Number(x[1]) - 1] + ' ' + x[0];
  return enDate(a) + ' – ' + enDate(b);
}

       sessions: renderSessions, roster: renderRoster, courses: renderCourses, certs: renderCerts, settings: renderSettings }[t] || renderCatalog)();
  }
  $('main').dataset.tab = t;

const _got = {};
function startPublic() {
  const mark = (k) => { _got[k] = true; if (_got.c && _got.s && _got.t) _ready = true; renderAll(); };
  pubUnsubs.push(S.listen('courses', v => { C = v || {}; mark('c'); }));
  pubUnsubs.push(S.listen('sessions', v => { SES = v || {}; mark('s'); }));
  pubUnsubs.push(S.listen('settings', v => { SET = Object.assign({}, DEFAULT_SETTINGS, v || {}); mark('t'); }));
}
window.onFirebaseReady = function (api) {
  fb = api;
  startPublic();
  fb.onAuthStateChanged(fb.auth, (u) => onUser(u ? { uid: u.uid, email: u.email, name: u.displayName } : null));
};
function init() {
  $('verLine').textContent = 'v' + APP_VERSION;
  const qs = new URLSearchParams(location.search);
  if (qs.get('verify')) { view.tab = 'verify'; view.verifyNo = qs.get('verify'); }
  renderWho(); renderTabs();
  if (!window.FIREBASE_CONFIG || !window.FIREBASE_CONFIG.apiKey) {
    DEMO = true;
    $('demoBar').classList.remove('hidden');
    DemoDB.load();
    startPublic();
    let u = null; try { u = JSON.parse(readLocal(DEMO_USER_KEY) || 'null'); } catch (e) {}
    onUser(u);
  }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('modalBg').classList.contains('hidden')) closeModal(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
init();
</script>

<script type="module">
/* โหลด Firebase SDK แล้วส่งฟังก์ชันที่ต้องใช้กลับไปให้สคริปต์หลัก (ข้ามเมื่อยังไม่ตั้งค่า = โหมดทดลอง) */
(async () => {
  const cfg = window.FIREBASE_CONFIG;
  if (!cfg || !cfg.apiKey || !cfg.databaseURL) return;
  const V = 'https://www.gstatic.com/firebasejs/10.12.5/';
  try {
    const [appMod, authMod, dbMod] = await Promise.all([
      import(V + 'firebase-app.js'), import(V + 'firebase-auth.js'), import(V + 'firebase-database.js')
    ]);
    const app = appMod.initializeApp(cfg);
    const auth = authMod.getAuth(app);
    try { await authMod.setPersistence(auth, authMod.browserLocalPersistence); } catch (e) {}
    authMod.getRedirectResult(auth).catch((e) => { if (window.toast && window.authMessage) window.toast(window.authMessage(e)); });
    window.onFirebaseReady({
      auth, db: dbMod.getDatabase(app),
      GoogleAuthProvider: authMod.GoogleAuthProvider, signInWithPopup: authMod.signInWithPopup, signInWithRedirect: authMod.signInWithRedirect,
      signIn: authMod.signInWithEmailAndPassword, signUp: authMod.createUserWithEmailAndPassword, updateProfile: authMod.updateProfile,
      signOut: authMod.signOut, resetPassword: authMod.sendPasswordResetEmail, onAuthStateChanged: authMod.onAuthStateChanged,
      ref: dbMod.ref, set: dbMod.set, get: dbMod.get, update: dbMod.update, onValue: dbMod.onValue, push: dbMod.push, runTransaction: dbMod.runTransaction
    });
  } catch (e) {
    document.getElementById('main').innerHTML =
      '<div class="card"><div class="card-body"><div class="alert err" style="margin:0">โหลดระบบคลาวด์ไม่สำเร็จ — ตรวจสอบการเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรชหน้าเว็บ</div></div></div>';
  }
})();
</script>
